[package]
name = "autotappo"
version = "0.2.0"
description = "WuwaTappo background automation assistant"
authors = ["AutoTappo"]
edition = "2021"
rust-version = "1.77"

# Keep a stable binary name across Windows and macOS.
[[bin]]
name = "AutoTappo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
